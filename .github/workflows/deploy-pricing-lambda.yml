name: Deploy Pokemon ACE Pricing Lambda

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'lambda_pricing_pipeline.py'
      - 'ebay_coldcomps_scrapper.py'
      - 'match_pokemon_to_price.py'
      - 'lambda_requirements.txt'
      - 'Dockerfile.pricing-lambda'
      - '.github/workflows/deploy-pricing-lambda.yml'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  FUNCTION_NAME: PokemonAcePricingPipeline
  ECR_REPOSITORY: pokemon-ace-pricing-pipeline

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_LAMBDA_DEPLOY_ROLE_ARN }}

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "$ECR_REPOSITORY" >/dev/null

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Lambda image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -f Dockerfile.pricing-lambda -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Deploy Lambda image
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --image-uri "$IMAGE_URI" \
            --publish

      - name: Configure Lambda
        run: |
          aws lambda update-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --timeout 900 \
            --memory-size 1024 \
            --environment "Variables={SOLDCOMPS_SECRET_NAME=pokemon/soldcomps-api}"

      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"

      - name: Smoke test
        run: |
          aws lambda invoke \
            --function-name "$FUNCTION_NAME" \
            --invocation-type RequestResponse \
            /tmp/lambda-response.json

          cat /tmp/lambda-response.json
