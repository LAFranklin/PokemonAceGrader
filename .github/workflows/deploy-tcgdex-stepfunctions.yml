name: Deploy TCGdex Step Functions

on:
  workflow_dispatch:
  push:
    branches:
      - lambda-tcgdex-downloader
    paths:
      - 'tcgdex_downloader_state_machine.json'
      - '.github/workflows/deploy-tcgdex-stepfunctions.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: tcgdex-stepfunctions-deploy
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  STATE_MACHINE_NAME: PokemonAceTcgdexDownloader
  LAMBDA_FUNCTION_NAME: PokemonAceTcgdexDownloader
  STEP_FUNCTIONS_ROLE_ARN: arn:aws:iam::413467635720:role/PokemonAceTcgdexStepFunctionsRole

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_LAMBDA_DEPLOY_ROLE_ARN }}

      - name: Validate Step Functions role
        run: |
          aws iam get-role --role-name PokemonAceTcgdexStepFunctionsRole >/dev/null

      - name: Create or update state machine
        run: |
          DEFINITION=$(cat tcgdex_downloader_state_machine.json)
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          STATE_MACHINE_ARN="arn:aws:states:$AWS_REGION:$ACCOUNT_ID:stateMachine:$STATE_MACHINE_NAME"

          if aws stepfunctions describe-state-machine --state-machine-arn "$STATE_MACHINE_ARN" >/dev/null 2>&1; then
            aws stepfunctions update-state-machine \
              --state-machine-arn "$STATE_MACHINE_ARN" \
              --role-arn "$STEP_FUNCTIONS_ROLE_ARN" \
              --definition "$DEFINITION"
          else
            aws stepfunctions create-state-machine \
              --name "$STATE_MACHINE_NAME" \
              --role-arn "$STEP_FUNCTIONS_ROLE_ARN" \
              --definition "$DEFINITION"
          fi

      - name: Show state machine
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          aws stepfunctions describe-state-machine \
            --state-machine-arn "arn:aws:states:$AWS_REGION:$ACCOUNT_ID:stateMachine:$STATE_MACHINE_NAME" \
            --query '{name:name,status:status,arn:stateMachineArn}'
